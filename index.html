<!DOCTYPE html>

<title>Подбор СИЗ по ГОСТ и ТР ТС 019/2011 (с учётом Решения Совета ЕЭК от 13.03.2026 № 40)</title>
<!--
  Учебный тренажёр «Подбор СИЗ в соответствии с ГОСТ и ТР ТС 019/2011»
  Механика: производственная ситуация → перечень рисков → обучающийся самостоятельно
  собирает комплект СИЗ из каталога → проверка комплекта (недостающее/лишнее) → разбор.
  Чистый HTML + CSS + JS. Внешние библиотеки не используются (при необходимости — подключение через CDN).
  Нормативная база:
    • ТР ТС 019/2011 «О безопасности средств индивидуальной защиты» (Решение КТС от 09.12.2011 № 878);
    • Перечень стандартов, применение которых на добровольной основе обеспечивает соблюдение ТР ТС 019/2011;
    • ГОСТ EN 397-2020 (каски, действует с 01.10.2021, взамен ГОСТ EN 397-2012);
    • ГОСТ 12.4.253-2013 (СИЗ глаз, с Изменением № 1 от 01.07.2022);
    • ГОСТ 12.4.252-2013 (перчатки, действует с 01.03.2014, взамен ГОСТ Р 12.4.246-2008);
    • ГОСТ 12.4.281-2014 (сигнальная одежда повышенной видимости, классы 1–3);
    • ГОСТ Р ЕН 361-2008 (страховочные привязи, взамен ГОСТ Р 12.4.224-99);
    • ГОСТ Р ЕН 358-2008 (удерживающие пояса — только позиционирование, не страховка при падении).
  Масштабирование: все размеры в em от базовой единицы u = min(ширина/56, высота/60),
  вычисляемой через ResizeObserver — содержимое и читаемость сохраняются при любом размере.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0f1e;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

  #app {
    position: relative; width: 100vw; height: 600px; max-height: 100vh;
    overflow: hidden; display: flex; flex-direction: column;
    color: #e8edf7; font-size: 10px; /* переопределяется скриптом */
    background:
      radial-gradient(120em 60em at 85% -20%, rgba(59,90,160,.35), transparent 60%),
      radial-gradient(90em 50em at -10% 110%, rgba(251,191,36,.10), transparent 55%),
      linear-gradient(180deg, #0f1730 0%, #0b1122 100%);
    user-select: none;
  }
  .hz { flex: 0 0 auto; height: .55em;
    background: repeating-linear-gradient(135deg, #fbbf24 0 1.1em, #141c2f 1.1em 2.2em); }

  /* ── шапка ─────────────────────────────────────── */
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 1em;
    padding: .9em 1.7em .5em; }
  .logo { width: 2.6em; height: 2.6em; flex: 0 0 auto; }
  .logo svg, .ic svg, .gauge svg { width: 100%; height: 100%; display: block; }
  .brand b { display: block; font-size: 1.35em; letter-spacing: .04em; }
  .brand span { display: block; font-size: .9em; color: #8fa0bf; margin-top: .1em; }
  .badge-tr { margin-left: auto; flex: 0 0 auto; background: rgba(251,191,36,.12);
    border: 1px solid rgba(251,191,36,.5); color: #fbbf24; font-size: .95em;
    font-weight: 700; padding: .4em .8em; border-radius: .55em; white-space: nowrap; }
  .score { flex: 0 0 auto; background: #16223f; border: 1px solid #263452;
    color: #cbd5e1; font-size: .95em; font-weight: 600; padding: .4em .8em;
    border-radius: .55em; white-space: nowrap; }
  .pbar { flex: 0 0 auto; height: .5em; background: #1a2542; margin: 0 1.7em .2em;
    border-radius: 1em; overflow: hidden; }
  .pbar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #f59e0b, #fde68a); border-radius: 1em;
    transition: width .35s ease; }

  main { flex: 1 1 auto; min-height: 0; padding: .5em 1.7em 1.4em;
    display: flex; flex-direction: column; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column;
    animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(.5em); } }

  /* ── стартовый экран ───────────────────────────── */

  .intro h1 em { font-style: normal; color: #fbbf24; }
  .sub { color: #9fb0cc; font-size: 1.08em; line-height: 1.4; }
  .steps { display: flex; gap: .8em; flex-wrap: wrap; justify-content: center; }
  .step { flex: 1 1 15em; max-width: 20em; display: flex; gap: .7em; align-items: flex-start;
    background: #131c33; border: 1px solid #263452; border-radius: .9em; padding: .8em .9em; }
  .step .n { flex: 0 0 auto; width: 2em; height: 2em; border-radius: 50%;

    color: #fbbf24; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .step b { display: block; font-size: 1.02em; margin-bottom: .2em; }
  .step span { font-size: .92em; color: #9fb0cc; line-height: 1.3; }
  .tiles { display: flex; gap: .8em; flex-wrap: wrap; justify-content: center; }
  .tile { flex: 1 1 9.5em; max-width: 13em; background: #131c33; border: 1px solid #263452;

    display: flex; flex-direction: column; align-items: center; gap: .3em; }
  .tile .ic { width: 3.3em; height: 3.3em; }
  .tile b { font-size: 1em; line-height: 1.15; }
  .tile span { font-size: .8em; color: #8fa0bf; line-height: 1.2; }
  .chips { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
  .chip { background: #131c33; border: 1px solid #263452; border-radius: .6em;
    padding: .45em .8em; font-size: .92em; color: #cbd5e1; text-align: center; }
  .chip b { color: #fbbf24; }
  .chip.new40 { border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.08); }
  .startrow { display: flex; align-items: center; gap: 1.2em; justify-content: center;
    flex-wrap: wrap; margin-top: auto; }
  .hint { font-size: .92em; color: #7c8aa5; }

  /* ── экран ситуации ────────────────────────────── */
  .scr { max-width: 60em; width: 100%; margin: 0 auto; gap: .5em; }
  .scenario { background: #131c33; border: 1px solid #263452; border-radius: .9em;
    padding: .7em 1em; }
  .sc-head { display: flex; align-items: center; gap: .8em; flex-wrap: wrap; }
  .snum { background: #16223f; border: 1px solid #263452; border-radius: .55em;
    padding: .28em .7em; font-size: .9em; font-weight: 700; white-space: nowrap; }
  .stitle { font-size: 1.18em; font-weight: 700; }
  .sdesc { font-size: .95em; color: #9fb0cc; line-height: 1.3; margin-top: .25em; }
  .hazrow { display: flex; gap: .55em; flex-wrap: wrap; margin-top: .5em; }
  .haz { display: inline-flex; gap: .45em; align-items: center;
    background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.5);
    color: #fcd34d; border-radius: .55em; padding: .28em .6em; font-size: .9em; font-weight: 600; }
  .haz svg { width: 1.5em; height: 1.5em; flex: 0 0 auto; }
  .lbl { font-size: .85em; color: #8fa0bf; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45em; }
  .card { position: relative; display: flex; gap: .55em; align-items: center;
    background: #131c33; border: .14em solid #263452; border-radius: .7em;
    padding: .38em .55em; cursor: pointer; font-family: inherit; color: inherit; text-align: left;
    transition: border-color .15s, background .15s; }
  .card:hover:not(.locked) { border-color: #3d5590; background: #172345; }
  .card .ic { width: 2.3em; height: 2.3em; flex: 0 0 auto; }
  .card .nm { font-size: .9em; font-weight: 600; line-height: 1.12; }
  .card .st { font-size: .74em; color: #8fa0bf; margin-top: .12em; line-height: 1.18; }
  .card.sel { background: rgba(251,191,36,.12); border-color: #fbbf24; }
  .card.sel::after { content: "✓"; position: absolute; top: .3em; right: .5em;
    color: #fbbf24; font-weight: 800; font-size: 1.05em; }
  .card.locked { cursor: default; opacity: .8; }
  .kit { min-height: 2.9em; background: #0f182c; border: .14em dashed #33435f;
    border-radius: .8em; padding: .4em .6em; display: flex; gap: .5em; flex-wrap: wrap;
    align-items: center; }
  .kit .empty { color: #66748f; font-size: .94em; }
  .kchip { display: inline-flex; align-items: center; gap: .45em; background: #16223f;

    font-family: inherit; color: inherit; cursor: pointer; }
  .kchip svg { width: 1.5em; height: 1.5em; }
  .kchip .x { color: #f87171; font-weight: 800; margin-left: .15em; }
  .kchip:hover { border-color: #f87171; }
  .kchip.locked { cursor: default; opacity: .8; }
  .ctl { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; }
  .cnt { font-size: .95em; color: #8fa0bf; font-weight: 600; }
  .ctl .note { margin-left: auto; font-size: .88em; color: #66748f; }
  .fb { margin-top: .1em; background: #101a30; border-radius: .8em; padding: .65em .9em;

  .fb .t { font-weight: 700; font-size: 1.08em; }
  .fb .t.ok { color: #34d399; } .fb .t.no { color: #f87171; }
  .fb .x { font-size: .92em; color: #b7c4dd; line-height: 1.3; margin-top: .2em; }
  .fb .verdict { font-size: .94em; margin-top: .3em; line-height: 1.35; }
  .fb .verdict .miss { color: #f87171; font-weight: 600; }

    align-items: center; justify-content: center; flex-wrap: wrap; }
  .gauge { position: relative; width: 11.5em; height: 11.5em; flex: 0 0 auto; }

  .resinfo { flex: 0 1 27em; display: flex; flex-direction: column; gap: .7em; }
  .resinfo h2 { font-size: 1.6em; line-height: 1.2; }
  .resinfo .msg { color: #9fb0cc; font-size: 1.05em; line-height: 1.4; }
  .srow { display: flex; align-items: center; gap: .6em; padding: .35em 0;
    border-bottom: 1px solid #1c2740; font-size: .98em; }
  .srow:last-child { border-bottom: 0; }
  .srow .mk { flex: 0 0 auto; width: 1.6em; height: 1.6em; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .9em; }
  .srow .mk.g { background: rgba(52,211,153,.18); color: #34d399; }
  .srow .mk.r { background: rgba(248,113,113,.15); color: #f87171; }
  .srow .how { margin-left: auto; font-size: .85em; color: #66748f; white-space: nowrap; }

  /* ── кнопки ────────────────────────────────────── */
  .btn { background: linear-gradient(180deg, #fcd34d, #f59e0b); color: #241a03;
    border: 0; font-family: inherit; font-weight: 700; font-size: 1.15em;
    padding: .7em 1.5em; border-radius: .65em; cursor: pointer;
    box-shadow: 0 .3em 1.2em rgba(245,158,11,.35); transition: transform .1s, filter .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); }
  .btn.sm { font-size: 1em; padding: .55em 1.2em; }
  .btn.ghost { background: #16223f; color: #cbd5e1; border: 1px solid #2c3d63; box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: default; filter: none; box-shadow: none; }

  /* ── встроенный ресайзер ───────────────────────── */
  .rz { position: absolute; right: 0; bottom: 0; width: 2.4em; height: 2.4em;
    cursor: nwse-resize; z-index: 60; display: flex; align-items: center;
    justify-content: center; touch-action: none; }
  .rz svg { width: 1.5em; height: 1.5em; opacity: .85; }
  .rz:hover svg { opacity: 1; }
  .rzlabel { position: absolute; right: 2.8em; bottom: .7em; font-size: .9em;
    background: #1e293b; border: 1px solid #33435f; padding: .3em .65em;
    border-radius: .5em; color: #cbd5e1; display: none; z-index: 60; white-space: nowrap; }
  .rzreset { position: absolute; right: .6em; bottom: 2.7em; z-index: 60; display: none;
    background: #1e293b; border: 1px solid #33435f; color: #fbbf24; font-size: .85em;
    font-family: inherit; font-weight: 600; padding: .35em .7em; border-radius: .5em;
    cursor: pointer; white-space: nowrap; }
  .rzreset:hover { background: #26344e; }
</style>
</head>

const N = SCENARIOS.length;

/* ═══════════ Состояние ═══════════ */
const app = document.getElementById("app");
const main = document.getElementById("main");
const pfill = document.getElementById("pfill");
const scoreEl = document.getElementById("score");
document.getElementById("logo").innerHTML = I.shield;

let si = 0;                 // индекс ситуации
let sel = new Set();        // выбранные СИЗ
let checked = false;        // выбор проверен (карточки заблокированы)
let tries = 0;              // попыток в текущей ситуации
let results = [];           // {passed, first} по ситуациям

function setProgress(p) { pfill.style.width = (p * 100).toFixed(1) + "%"; }
function updScore() {
  const ok = results.filter(r => r && r.passed).length;
  scoreEl.textContent = "✓ " + ok + " / " + N;
}

/* ═══════════ Экраны ═══════════ */
function renderIntro() {
  setProgress(0); updScore();
  const five = ["helmet", "goggles", "gloves", "vest3", "harness"];
  const tiles = five.map(id => {
    const c = CAT[id];

  }).join("");

      <div class="step"><div class="n">2</div><div><b>Соберите комплект</b><span>Нажимайте карточки в каталоге — только то, что действительно нужно.</span></div></div>
      <div class="step"><div class="n">3</div><div><b>Проверьте подбор</b><span>Тренажёр укажет на недостающее и лишнее, пояснит по ГОСТ.</span></div></div>

}

function renderScenario() {
  const s = SCENARIOS[si];
  setProgress(si / N); updScore();
  main.innerHTML = `
  <div class="screen scr">
    <div class="scenario">
      <div class="sc-head"><span class="snum">Ситуация ${si + 1} из ${N}</span><span class="stitle">${s.title}</span></div>
      <div class="sdesc">${s.desc}</div>
      <div class="hazrow">${s.hazards.map(h => `<span class="haz">${HAZ[h[0]]}${h[1]}</span>`).join("")}</div>
    </div>
    <div class="lbl">Каталог СИЗ — нажмите карточку, чтобы добавить в комплект</div>
    <div class="cards" id="cards">
      ${CATALOG.map(c => `
        <button class="card ${sel.has(c.id) ? "sel" : ""} ${checked ? "locked" : ""}" data-id="${c.id}">
          <div class="ic">${I[c.ic]}</div>
          <div><div class="nm">${c.n}</div><div class="st">${c.std}</div></div>
        </button>`).join("")}
    </div>
    <div class="lbl">Ваш комплект</div>
    <div class="kit" id="kit">
      ${sel.size === 0
        ? `<span class="empty">Пока пусто — выберите СИЗ из каталога выше</span>`
        : [...sel].map(id => {
            const c = CAT[id];
            return `<button class="kchip ${checked ? "locked" : ""}" data-id="${id}">${I[c.ic]}<span>${c.s}</span><span class="x">✕</span></button>`;
          }).join("")}
    </div>
    <div class="ctl">
      <button class="btn" id="confirm" ${sel.size === 0 || checked ? "disabled" : ""}>Проверить подбор</button>
      <span class="cnt">Выбрано: ${sel.size}</span>
      <span class="note">Подбирайте СИЗ только от указанных рисков</span>
    </div>
    <div id="fbwrap"></div>
  </div>`;
}

function doCheck() {
  const s = SCENARIOS[si];
  tries++; checked = true;
  const need = new Set(s.kit);
  const missing = [...need].filter(id => !sel.has(id));
  const extra = [...sel].filter(id => !need.has(id));
  const ok = missing.length === 0 && extra.length === 0;
  if (ok && !results[si]) results[si] = { passed: true, first: tries === 1 };
  updScore();
  renderScenario(); // перерисовка с заблокированными карточками
  const missTxt = missing.map(id => CAT[id].n).join(", ");
  const extraTxt = extra.map(id => CAT[id].s).join(", ");
  document.getElementById("fbwrap").innerHTML = `
    <div class="fb ${ok ? "" : "bad"}">
      <div class="t ${ok ? "ok" : "no"}">${ok ? "✔ Комплект подобран верно!" : "✘ В подборе есть ошибки"}</div>
      ${ok ? "" : `<div class="verdict">
        ${missing.length ? `<span class="miss">Не хватает: ${missTxt}.</span><br>` : ""}
        ${extra.length ? `<span class="extra">Лишнее: ${extraTxt} — при указанных рисках не применяется.</span>` : ""}
      </div>`}
      <div class="x">${s.x}</div>
      <div>${s.chips.map(c => `<span class="std">${c}</span>`).join("")}</div>
      <div class="nextrow">
        ${ok
          ? `<button class="btn sm" data-act="next">${si === N - 1 ? "Результаты ➔" : "Следующая ситуация ➔"}</button>`
          : `<button class="btn sm ghost" data-act="fix">Исправить выбор</button>
             <button class="btn sm" data-act="next">${si === N - 1 ? "Результаты ➔" : "Дальше ➔"}</button>`}
      </div>
    </div>`;
}

function renderResult() {
  setProgress(1); updScore();
  const ok = results.filter(r => r && r.passed).length;
  const p = Math.round(ok / N * 100);
  const C = 2 * Math.PI * 52;
  const on = (C * p / 100).toFixed(1);
  const v = p === 100 ? ["Эксперт по подбору СИЗ", "Все комплекты собраны правильно — требования ТР ТС 019/2011 и ГОСТ усвоены."]
        : p >= 50 ? ["Хороший результат", "Повторите ситуации с ошибками: обратите внимание на классы сигнальной одежды, различие привязи и удерживающего пояса, а также новые виды СИЗ по Решению Совета ЕЭК № 40/2026."]
        : ["Требуется подготовка", "Изучите ТР ТС 019/2011 и перечень обеспечивающих его стандартов, затем пройдите тренажёр заново."];
  const rows = SCENARIOS.map((s, i) => {
    const r = results[i];
    const pass = r && r.passed;
    return `<div class="srow">
      <span class="mk ${pass ? "g" : "r"}">${pass ? "✓" : "✗"}</span>
      <span>${s.title}</span>
      <span class="how">${r ? (pass ? (r.first ? "с первой попытки" : "после исправления") : "не решена") : "не решена"}</span>
    </div>`;
  }).join("");
  main.innerHTML = `
  <div class="screen">
    <div class="res">
      <div class="gauge">
        <svg viewBox="0 0 120 120">
          <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
          </linearGradient></defs>
          <circle cx="60" cy="60" r="52" fill="none" stroke="#1e2a48" stroke-width="11"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gg)" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="${on} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
        </svg>
        <div class="mid"><b>${p}%</b><span>${ok} из ${N} ситуаций</span></div>
      </div>
      <div class="resinfo">
        <h2>${v[0]}</h2>
        <div class="msg">${v[1]}</div>
        <div>${rows}</div>
        <div><span class="std">ТР ТС 019/2011</span><span class="std">Решение Совета ЕЭК № 40 / 2026</span><span class="std">Перечень: Решение Коллегии ЕЭК № 30 / 2020</span><span class="std">ГОСТ EN 397-2020</span><span class="std">ГОСТ 12.4.253-2013</span><span class="std">ГОСТ 12.4.252-2013</span><span class="std">ГОСТ 12.4.281-2014</span><span class="std">ГОСТ Р ЕН 361-2008</span></div>
        <div class="nextrow" style="justify-content:flex-start">
          <button class="btn" data-act="restart">⟳ Пройти заново</button>
        </div>
      </div>
    </div>
  </div>`;
}

function start() {
  si = 0; results = new Array(N).fill(null);
  enterScenario();
}
function enterScenario() {
  sel = new Set(); tries = 0; checked = false;
  renderScenario();
}
function next() {
  if (!results[si]) results[si] = { passed: false, first: false };
  updScore();
  si++;
  if (si < N) enterScenario(); else renderResult();
}

/* ═══════════ Взаимодействие (делегирование) ═══════════ */
main.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "start" || a === "restart") start();
    else if (a === "next") next();
    else if (a === "fix") { checked = false; renderScenario(); }
    return;
  }
  if (e.target.closest("#confirm")) { doCheck(); return; }
  const card = e.target.closest(".card");
  if (card && !checked) {
    const id = card.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    renderScenario();
    return;
  }
  const chip = e.target.closest(".kchip");
  if (chip && !checked) {
    sel.delete(chip.dataset.id);
    renderScenario();
  }
});

renderIntro();

/* ═══════════ Масштабирование под любой размер (без потери содержания) ═══════════ */
function fit() {
  const r = app.getBoundingClientRect();
  let u = Math.min(r.width / 56, r.height / 60); // базовый размер 560×600
  u = Math.max(5.6, Math.min(u, 13));
  app.style.fontSize = u.toFixed(2) + "px";
}
new ResizeObserver(fit).observe(app);
fit();

/* ═══════════ Встроенный ресайзер ═══════════ */
const rz = document.getElementById("rz");
const rzlabel = document.getElementById("rzlabel");
const rzreset = document.getElementById("rzreset");
const MIN_W = 340, MIN_H = 430, MAX_H = 600;
let drag = false;

function maxH() { return Math.min(MAX_H, window.innerHeight); }

rz.addEventListener("pointerdown", e => {
  drag = true;
  rz.setPointerCapture(e.pointerId);
  rzlabel.style.display = "block";
  e.preventDefault();
});
rz.addEventListener("pointermove", e => {
  if (!drag) return;
  const w = Math.max(MIN_W, Math.min(e.clientX, window.innerWidth));
  const h = Math.max(MIN_H, Math.min(e.clientY, maxH()));
  app.style.width = w + "px";
  app.style.height = h + "px";
  rzlabel.textContent = Math.round(w) + " × " + Math.round(h);
  rzreset.style.display = "block";
  fit();
});
function endDrag() {
  if (!drag) return;
  drag = false;
  const full = app.getBoundingClientRect().width >= window.innerWidth - 1 &&
               app.getBoundingClientRect().height >= maxH() - 1;
  if (full) { app.style.width = ""; app.style.height = ""; rzlabel.style.display = "none"; rzreset.style.display = "none"; }
  else setTimeout(() => { if (!drag) rzlabel.style.display = "none"; }, 1600);
}
rz.addEventListener("pointerup", endDrag);
rz.addEventListener("pointercancel", endDrag);
rzreset.addEventListener("click", () => {
  app.style.width = ""; app.style.height = "";
  rzlabel.style.display = "none"; rzreset.style.display = "none";
  fit();
});
window.addEventListener("resize", () => {
  if (app.style.width) {
    const w = Math.min(parseFloat(app.style.width), window.innerWidth);
    app.style.width = (w >= window.innerWidth ? "" : w + "px");
  }
  if (app.style.height) {
    app.style.height = Math.min(parseFloat(app.style.height), maxH()) + "px";
  }
  fit();
});
</script>
