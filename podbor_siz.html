<!DOCTYPE html>
<html lang="ru">
<head>

<title>Итоговый тренажёр: новые требования к СИЗ (Решение Совета ЕЭК № 40, ГОСТы, новые виды СИЗ)</title>
<!-- CDN-подключения (при отсутствии сети используются системные резервы) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; } /* скроллов нет нигде */
  body {
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background:#0a0f1e;
    font-size:clamp(12px, 0.38vw + 10.6px, 16px);
    -webkit-font-smoothing:antialiased;
  }
  .trainer {
    width:100vw;                 /* относительная ширина 100vw */
    height:560px;
    min-height:450px;            /* минимум 450px */
    max-height:600px;            /* максимум 600px */
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    background:
      radial-gradient(1100px 420px at 15% -10%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(900px 380px at 90% 110%, rgba(168,85,247,.13), transparent 60%),
      linear-gradient(160deg,#101a30 0%, #0b1220 55%, #0a0f1e 100%);
    color:#e6edf7;
  }
  /* ---------- Шапка ---------- */
  .topbar { flex:none; display:flex; align-items:center; gap:.7em;
    padding:.5em 1em .4em; border-bottom:1px solid rgba(148,163,184,.14); }
  .logo { width:1.8em; height:1.8em; border-radius:.55em; flex:none;
    background:linear-gradient(135deg,#38bdf8,#818cf8); display:flex; align-items:center; justify-content:center;
    font-size:.9em; box-shadow:0 4px 14px rgba(56,189,248,.35); }
  .ttl { min-width:0; }
  .ttl h1 { font-size:.98em; font-weight:800; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttl p  { font-size:.68em; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer { flex:1; }
  .score { flex:none; font-size:.75em; font-weight:700; color:#7dd3fc;
    background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.35);
    padding:.3em .7em; border-radius:999px; white-space:nowrap; }
  .btn-ghost { flex:none; font:inherit; font-size:.72em; font-weight:600; color:#cbd5e1; cursor:pointer;
    background:rgba(148,163,184,.1); border:1px solid rgba(148,163,184,.3); border-radius:.55em; padding:.35em .75em; }
  .btn-ghost:hover { background:rgba(148,163,184,.2); }
  /* ---------- Навигация этапов ---------- */
  .stagenav { flex:none; display:flex; gap:.4em; padding:.45em 1em; }
  .pill { flex:1 1 0; min-width:0; font:inherit; font-size:.7em; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:.3em;
    padding:.45em .25em; border-radius:.6em; white-space:nowrap; overflow:hidden;
    background:rgba(148,163,184,.07); border:1px solid rgba(148,163,184,.18); color:#8ea0b8;
    transition:all .18s; }
  .pill span.nm { overflow:hidden; text-overflow:ellipsis; }
  .pill.locked { cursor:not-allowed; opacity:.55; }
  .pill.current { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.55); color:#bde6ff;
    box-shadow:0 0 0 1px rgba(56,189,248,.25), 0 6px 18px rgba(56,189,248,.15); }
  .pill.done { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.4); color:#a7f3c9; }
  .pill.open  { cursor:pointer; }
  .pill.open:hover { background:rgba(148,163,184,.16); }
  /* ---------- Бейджи зон ответственности ---------- */
  .rb { font-size:.58em; font-weight:700; border-radius:.4em; padding:.28em .6em; margin-left:auto; white-space:nowrap; flex:none; }
  .rb-ot    { background:rgba(34,197,94,.14);  color:#a7f3c9; border:1px solid rgba(34,197,94,.5); }
  .rb-joint { background:rgba(245,158,11,.13); color:#fcd34d; border:1px solid rgba(245,158,11,.5); }
  .rb-buh   { background:rgba(56,189,248,.12); color:#9fdcf8; border:1px solid rgba(56,189,248,.5); }
  .roleline { font-size:.75em; line-height:1.38; color:#cdd9ea; background:rgba(148,163,184,.07);
    border-left:3px solid #38bdf8; border-radius:.4em; padding:.4em .65em; }
  /* ---------- Цепочка ролей ---------- */
  .chain { display:flex; align-items:stretch; gap:.3em; }
  .cnode { flex:1 1 0; min-width:0; border-radius:.55em; padding:.35em .55em;
    border:1px dashed rgba(148,163,184,.3); background:rgba(148,163,184,.04); }
  .cnode b { display:block; font-size:.64em; letter-spacing:.03em; margin-bottom:.1em; color:#8ea0b8; text-transform:uppercase; }
  .cnode p { font-size:.66em; color:#93a3ba; line-height:1.28; }
  .cnode.on { border-style:solid; }
  .cnode.ot.on  { border-color:rgba(34,197,94,.6);  background:rgba(34,197,94,.08); }
  .cnode.ot.on b { color:#86efac; } .cnode.ot.on p { color:#cdeedd; }
  .cnode.buh.on { border-color:rgba(245,158,11,.6); background:rgba(245,158,11,.08); }
  .cnode.buh.on b { color:#fcd34d; } .cnode.buh.on p { color:#f2e3c0; }
  .cnode.ruk.on { border-color:rgba(168,85,247,.6); background:rgba(168,85,247,.08); }
  .cnode.ruk.on b { color:#d8b4fe; } .cnode.ruk.on p { color:#e4d5f7; }
  .carr { align-self:center; color:#64748b; font-size:.8em; flex:none; }
  /* ---------- Контент ---------- */
  .content { flex:1 1 auto; min-height:0; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center; padding:.3em 1em .15em; }
  .card { width:100%; max-width:1040px;
    background:rgba(15,23,42,.62); border:1px solid rgba(148,163,184,.16);
    border-radius:1em; padding:.8em 1.1em .85em; backdrop-filter:blur(6px);
    display:flex; flex-direction:column; gap:.5em;
    box-shadow:0 18px 40px rgba(2,6,23,.5); }
  .card h2 { font-size:.98em; font-weight:800; color:#e2f3ff; display:flex; align-items:center; gap:.45em; }
  .card h2 .tag { font-size:.6em; font-weight:700; color:#0b1220; background:linear-gradient(135deg,#38bdf8,#818cf8);
    border-radius:.4em; padding:.25em .55em; }
  .lead { font-size:.79em; color:#b7c4d8; line-height:1.38; }
  .theory { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:.45em; }
  .th { background:rgba(56,189,248,.07); border:1px solid rgba(56,189,248,.22); border-radius:.6em; padding:.45em .6em; }
  .th b { display:block; font-size:.66em; color:#7dd3fc; margin-bottom:.15em; letter-spacing:.03em; text-transform:uppercase; }
  .th p { font-size:.72em; color:#d5e2f2; line-height:1.32; }
  /* варианты ответа */
  .opts { display:flex; flex-direction:column; gap:.38em; }
  .opt { font:inherit; font-size:.8em; text-align:left; cursor:pointer; color:#dbe6f5;
    background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.25);
    border-radius:.6em; padding:.45em .75em; display:flex; gap:.55em; align-items:center; transition:all .15s; }
  .opt:hover { background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.5); }
  .opt .mk { flex:none; width:1.3em; height:1.3em; border-radius:.4em; background:rgba(148,163,184,.15);
    display:flex; align-items:center; justify-content:center; font-size:.72em; font-weight:700; color:#9fb2c9; }
  .opt.ok    { background:rgba(34,197,94,.16); border-color:#22c55e; color:#c9f7dc; }
  .opt.ok .mk { background:#22c55e; color:#04240f; }
  .opt.bad   { background:rgba(239,68,68,.14); border-color:#ef4444; color:#ffd7d7; animation:shake .3s; }
  .opt:disabled { cursor:default; }
  /* чипсы */
  .chips { display:flex; flex-wrap:wrap; gap:.4em; }
  .chip { font:inherit; font-size:.76em; font-weight:600; cursor:pointer; color:#cfe0f2;
    background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.3);
    border-radius:999px; padding:.4em .9em; transition:all .15s; }
  .chip:hover { border-color:#38bdf8; }
  .chip.sel { background:rgba(56,189,248,.2); border-color:#38bdf8; color:#d7f1ff; box-shadow:0 0 0 1px rgba(56,189,248,.4); }
  .chip.ok { background:rgba(34,197,94,.2); border-color:#22c55e; color:#c9f7dc; }
  .chip.bad { background:rgba(239,68,68,.18); border-color:#ef4444; color:#ffd7d7; animation:shake .3s; }
  /* соответствия */
  .matchwrap { display:grid; grid-template-columns:1fr 1fr; gap:.45em .8em; }
  .mcol { display:flex; flex-direction:column; gap:.34em; min-width:0; }
  .mcol h3 { font-size:.64em; text-transform:uppercase; letter-spacing:.06em; color:#7dd3fc; }
  .mitem { font:inherit; font-size:.73em; text-align:left; cursor:pointer; color:#dbe6f5;
    background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.25); border-radius:.5em;
    padding:.38em .6em; line-height:1.28; transition:all .15s; }
  .mitem:hover { border-color:#38bdf8; }
  .mitem.sel { background:rgba(56,189,248,.2); border-color:#38bdf8; box-shadow:0 0 0 1px rgba(56,189,248,.45); }
  .mitem.done { background:rgba(34,197,94,.15); border-color:rgba(34,197,94,.65); color:#c9f7dc; cursor:default; }
  .mitem.bad { background:rgba(239,68,68,.16); border-color:#ef4444; animation:shake .3s; }
  /* сертификация/декларирование */
  .trow { display:flex; align-items:center; gap:.55em; background:rgba(148,163,184,.06);
    border:1px solid rgba(148,163,184,.2); border-radius:.55em; padding:.38em .6em; }
  .trow .lb { flex:1 1 auto; min-width:0; font-size:.76em; color:#dbe6f5; line-height:1.28; }
  .tbtns { flex:none; display:flex; gap:.3em; }
  .tb { font:inherit; font-size:.66em; font-weight:700; cursor:pointer; border-radius:.45em; padding:.35em .6em;
    background:rgba(148,163,184,.1); border:1px solid rgba(148,163,184,.3); color:#aebdd2; white-space:nowrap; }
  .tb.sel { background:rgba(56,189,248,.22); border-color:#38bdf8; color:#d7f1ff; }
  .trow.ok   { border-color:rgba(34,197,94,.6); background:rgba(34,197,94,.08); }
  .trow.bad  { border-color:#ef4444; background:rgba(239,68,68,.08); animation:shake .3s; }
  /* кейсы */
  .cases { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.45em; }
  .case { font:inherit; text-align:left; cursor:pointer; border-radius:.6em; padding:.5em .65em;
    background:rgba(148,163,184,.07); border:1px solid rgba(148,163,184,.25); color:#dbe6f5;
    font-size:.73em; line-height:1.32; transition:all .15s; }
  .case b { display:block; font-size:.88em; color:#7dd3fc; margin-bottom:.12em; }
  .case.sel { border-color:#f59e0b; background:rgba(245,158,11,.14); box-shadow:0 0 0 1px rgba(245,158,11,.45); }
  .case.ok  { border-color:#22c55e; background:rgba(34,197,94,.14); }
  .case.bad { border-color:#ef4444; background:rgba(239,68,68,.12); animation:shake .3s; }
  /* кнопки/обратная связь */
  .row { display:flex; align-items:center; gap:.7em; flex-wrap:wrap; }
  .btn { font:inherit; font-size:.82em; font-weight:700; cursor:pointer; border:none; border-radius:.6em;
    padding:.5em 1.2em; color:#062033; background:linear-gradient(135deg,#38bdf8,#5eead4);
    box-shadow:0 6px 16px rgba(56,189,248,.3); transition:transform .12s, filter .12s; }
  .btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .btn:disabled { opacity:.4; cursor:default; transform:none; }
  .fb { font-size:.75em; line-height:1.38; border-radius:.5em; padding:.45em .7em; display:none; }
  .fb.show { display:block; }
  .fb.good { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.45); color:#c9f7dc; }
  .fb.fail { background:rgba(239,68,68,.1);  border:1px solid rgba(239,68,68,.45); color:#ffd9d9; }
  .hint { font-size:.7em; color:#8ea0b8; }
  /* финал */
  .final { text-align:center; display:flex; flex-direction:column; align-items:center; gap:.45em; padding:.4em 0 .2em; }
  .final .big { font-size:1.9em; font-weight:800; color:#7dd3fc; line-height:1; }
  .final .verdict { font-size:.9em; font-weight:700; }
  .final .sub { font-size:.74em; color:#94a3b8; max-width:52em; line-height:1.42; }
  .medal { font-size:2.1em; line-height:1; }
  /* подвал + прогресс */
  .bottom { flex:none; padding:.3em 1em .85em; }
  .pbar { height:.4em; border-radius:99px; background:rgba(148,163,184,.15); overflow:hidden; }
  .pfill { height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#38bdf8,#22c55e); transition:width .35s; }
  .prow { display:flex; align-items:center; gap:.8em; margin-top:.28em; }
  /* ресайзер */
  .resizer { position:absolute; left:0; right:0; bottom:0; height:1em; cursor:ns-resize; z-index:20;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:.1em;
    background:linear-gradient(to top, rgba(56,189,248,.14), transparent); }
  .grip { display:flex; align-items:center; gap:.45em; font-size:.6em; color:#7dd3fc; user-select:none; }
  .grip .bars { display:flex; flex-direction:column; gap:2px; }
  .grip .bars i { display:block; width:2.4em; height:2px; border-radius:2px; background:rgba(125,211,252,.65); }
  /* тост */
  .toast { position:absolute; top:.55em; left:50%; transform:translateX(-50%) translateY(-.4em);
    background:rgba(34,197,94,.16); border:1px solid rgba(34,197,94,.6); color:#c9f7dc;
    font-size:.75em; font-weight:700; padding:.4em .9em; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .3s; z-index:30; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
</style>
</head>

<div class="trainer" id="trainer">

  <div class="topbar">
    <div class="logo">🛡️</div>
    <div class="ttl">
      <h1>Итоговый тренажёр: закупка и выдача СИЗ по новым требованиям</h1>
      <p>Решение Совета ЕЭК № 40 · ГОСТы · новые виды СИЗ · подходит всем: коммерция, ГБУ, ГКЗ · логика: СОТ → Бухгалтерия/Снабжение → Руководитель</p>

<script>
/* ================================================================
   ИТОГОВЫЙ ТРЕНАЖЁР ПО РЕЗУЛЬТАТАМ УРОКОВ:
   Решение Совета ЕЭК от 13.03.2026 № 40, ГОСТы, новые виды СИЗ.
   Этапы: 1 Новое в регламенте → 2 Показатели для ТЗ →
   3 ГОСТы и оценка соответствия → 4 Входной контроль →
   5 Выдача и личная карточка → 6 Аргументы СОТ.
   ================================================================ */
(function(){
'use strict';

/* ---------------- ДАННЫЕ ЭТАПОВ ---------------- */
const STAGES = [
{
  name:'Новое в регламенте',
  role:'ot',
  roleNote:'Итог начинаем с того, что Решение № 40 впервые ввело в ТР ТС 019/2011: без новых объектов и видов СИЗ техзадание не собрать.',
  chain:[
    ['ot','СОТ','Знает новые виды СИЗ и включает их в техзадание'],
    ['buh','Бухгалтерия / снабжение','На этом этапе не участвует'],
    ['ruk','Руководитель','На этом этапе не участвует']
  ],
  steps:[
   { type:'brief', title:'Что впервые ввело в регламент Решение № 40',
     theory:[
      ['Сроки','Опубликовано 27.04.2026, в силе с 27.04.2027; часть положений — с даты включения ГОСТов в перечень стандартов'],
      ['Пила и химия','СИЗ от режущего воздействия ручной цепной пилы; репеллентные и инсектоакарицидные средства (насекомые, клещи)'],
      ['Голова и высота','Каскетки защитные; анкерные устройства; устройства для спуска'],
      ['СИЗОД и одежда','Респираторы и противогазы — отдельные виды; СИЗОД с принудительной подачей воздуха; одежда от прохладной среды']
     ],
     lead:'Выберите новые объекты регулирования и проверьте знание сроков.' },

   { type:'multi', tag:'Задание', score:true,
     q:'Какие СИЗ впервые включены в область регулирования ТР ТС 019/2011 Решением № 40?',
     items:[
      ['СИЗ от режущего воздействия ручной цепной пилы',1],
      ['Репеллентные средства от насекомых и клещей',1],
      ['Каскетки защитные',1],
      ['СИЗОД фильтрующие с принудительной подачей воздуха',1],
      ['Костюмы изолирующие от химических факторов',0],
      ['Фильтрующие полумаски (FFP1–FFP3)',0],
      ['Привязи страховочные',0],
      ['Каски защитные',0]
     ],
     explain:'Изолирующие костюмы, полумаски FFP, страховочные привязи и каски регулировались и раньше. Впервые введены: защита от цепной пилы, репелленты и инсектоакарициды, каскетки, СИЗОД с принудительной подачей воздуха, анкерные устройства, устройства для спуска, одежда от прохладной среды.' },

   { type:'single', tag:'Вопрос 1', score:true,
     q:'С какой даты СИЗ должны обязательно соответствовать ТР ТС 019/2011 в редакции Решения № 40?',
     opts:['Сразу после опубликования — 27.04.2026','С 27.04.2027 — через 12 месяцев после опубликования','С 13.03.2027 — через 12 месяцев после подписания','С 01.01.2028 — с нового года'],
     ok:1,
     explain:'Решение опубликовано 27.04.2026 и вступает в силу через 12 месяцев — 27.04.2027. Отдельные положения — с даты решения Коллегии ЕЭК о включении ГОСТов в перечень стандартов.' },

   { type:'single', tag:'Вопрос 2', score:true,
     q:'Средства для защиты от паукообразных (клещей) по новому регламенту предназначены для нанесения:',
     opts:['На кожу человека','Только на одежду','На кожу и одежду по выбору работника','На любые поверхности и оборудование'],
     ok:1,
     explain:'Средства от насекомых допустимо наносить на одежду, а средства для защиты от паукообразных (клещей) — только на одежду. Это учтено в новом определении дерматологических СИЗ.' }
  ]
},
{
  name:'Показатели для ТЗ',
  role:'joint',
  roleNote:'Техзадание готовит СОТ: именно он переносит количественные показатели Решения № 40 в требования к закупаемым СИЗ.',
  chain:[
    ['ot','СОТ','Переносит показатели Решения № 40 в техническое задание'],
    ['buh','Бухгалтерия / закупки','Закупает строго по ТЗ (44-ФЗ, 223-ФЗ или внутренний регламент)'],
    ['ruk','Руководитель','Утверждает расход, заключает договор']
  ],
  steps:[

/* ---------------- СОСТОЯНИЕ ---------------- */
const SKEY='siz_final_trainer_v1';
let state = { stage:0, step:0, unlocked:0, score:0, firstTried:{}, stageDone:[] };
try{ const s=localStorage.getItem(SKEY); if(s) state=Object.assign(state, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} }

const $=id=>document.getElementById(id);
const trainer=$('trainer'), wrap=$('stageWrap'), nav=$('stageNav'),
      scoreBadge=$('scoreBadge'), pfill=$('pfill'), posLabel=$('posLabel'),
      hintLabel=$('hintLabel'), toast=$('toast'), hLabel=$('hLabel');

const TOTAL_TASKS = STAGES.reduce((a,s)=>a+s.steps.filter(x=>x.score).length,0);
scoreBadge.textContent='Баллы: 0 / '+TOTAL_TASKS;

/* ---------------- НАВИГАЦИЯ ЭТАПОВ ---------------- */
function renderNav(){
  nav.innerHTML='';
  STAGES.forEach((st,i)=>{
    const b=document.createElement('button');
    let cls='pill', icon='🔒';
    if(i<state.unlocked){ cls+=' open'; icon='●'; }
    if(state.stageDone.includes(i)){ cls+=' done'; icon='✓'; }
    if(i===state.stage){ cls+=' current'; }
    if(i>state.unlocked){ cls+=' locked'; }
    b.className=cls;
    b.innerHTML='<span>'+(i+1)+'.</span><span class="nm">'+st.name+'</span><span>'+icon+'</span>';
    b.onclick=()=>{ if(i>state.unlocked){ toastMsg('Этап заблокирован: сначала пройдите предыдущий'); return; }
                    if(i===state.stage) return;
                    state.stage=i; state.step=0; save(); render(); };
    nav.appendChild(b);
  });
}

/* ---------------- ПРОГРЕСС ---------------- */
function updateProgress(){
  let done=0;
  STAGES.forEach((st,i)=>{ st.steps.forEach((s,j)=>{ if(s.score && state.firstTried[i+'_'+j]!==undefined) done++; }); });
  pfill.style.width=Math.round(done/TOTAL_TASKS*100)+'%';
  const st=STAGES[state.stage];
  const isFinal=state.stage===STAGES.length-1 && state.step>st.steps.length;
  posLabel.textContent = isFinal ? 'Тренажёр завершён' :
    'Этап '+(state.stage+1)+' из '+STAGES.length+' · Шаг '+(Math.min(state.step+1,st.steps.length))+' из '+st.steps.length;
  hintLabel.textContent='Баллы начисляются только за правильный ответ с первой попытки';
  scoreBadge.textContent='Баллы: '+state.score+' / '+TOTAL_TASKS;
}

/* ---------------- ВСПОМОГАТЕЛЬНЫЕ ---------------- */
function toastMsg(t){ toast.textContent=t; toast.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toast.classList.remove('show'),2400); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function key(){ return state.stage+'_'+state.step; }
function award(){ const k=key(); if(state.firstTried[k]===undefined){ state.firstTried[k]=1; state.score++; save(); updateProgress(); } }
function markTriedWrong(){ const k=key(); if(state.firstTried[k]===undefined){ state.firstTried[k]=0; save(); } }
function feedback(el, ok, text){
  el.className='fb show '+(ok?'good':'fail');
  el.innerHTML=(ok?'✅ Верно. ':'❌ Неверно. ')+text;
}
function nextBtn(card, label){
  const b=document.createElement('button'); b.className='btn'; b.textContent=label||'Далее →';
  b.onclick=()=>{ state.step++; save(); render(); };
  return b;
}
function goNextStage(){
  if(state.stage<STAGES.length-1){ state.stage++; state.step=0;
    if(state.stage>state.unlocked) state.unlocked=state.stage;
    save(); render(); toastMsg('Этап '+(state.stage+1)+' открыт'); }
}
function finishStage(){
  if(!state.stageDone.includes(state.stage)){ state.stageDone.push(state.stage); save(); }
  state.step=STAGES[state.stage].steps.length; save(); render();
}

/* ---------------- РОЛИ И КАРТОЧКИ ---------------- */
const ROLE_INFO={
  ot:['ot','👷 Функционал специалиста по ОТ'],
  joint:['joint','🤝 Совместная зона (несколько ролей)'],
  buh:['buh','🧾 Бухгалтерия/склад · СОТ контролирует']
};
function cardEl(title, tag){
  const c=document.createElement('div'); c.className='card';
  if(title){ const h=document.createElement('h2');
    h.innerHTML=(tag?'<span class="tag">'+tag+'</span>':'')+title;
    const role=ROLE_INFO[STAGES[state.stage].role];
    if(role){ h.insertAdjacentHTML('beforeend','<span class="rb rb-'+role[0]+'">'+role[1]+'</span>'); }
    c.appendChild(h); }
  return c;
}
function chainEl(st){
  const d=document.createElement('div'); d.className='chain';
  st.chain.forEach((n,i)=>{
    if(i>0){ const a=document.createElement('div'); a.className='carr'; a.textContent='→'; d.appendChild(a); }
    const [k,name,act]=n;
    const node=document.createElement('div');
    node.className='cnode '+k+(act&&!act.startsWith('На этом')?' on':'');
    node.innerHTML='<b>'+name+'</b><p>'+act+'</p>';
    d.appendChild(node);
  });
  return d;
}

/* ---------------- РЕНДЕР ШАГОВ ---------------- */
function renderBrief(st){
  const c=cardEl(st.title,'Теория');
  const cur=STAGES[state.stage];
  if(cur.chain){ c.appendChild(chainEl(cur)); }
  if(cur.roleNote){ const rl=document.createElement('div'); rl.className='roleline'; rl.textContent=cur.roleNote; c.appendChild(rl); }
  const t=document.createElement('div'); t.className='theory';
  st.theory.forEach(([b,p])=>{ const d=document.createElement('div'); d.className='th';
    d.innerHTML='<b>'+b+'</b><p>'+p+'</p>'; t.appendChild(d); });
  c.appendChild(t);
  const lead=document.createElement('p'); lead.className='lead'; lead.textContent=st.lead; c.appendChild(lead);
  const r=document.createElement('div'); r.className='row';
  r.appendChild(nextBtn(c,'Понятно, к заданиям →'));
  c.appendChild(r);
  return c;
}

function renderSingle(st){
  const c=cardEl(st.q, st.tag||'Вопрос');
  const opts=document.createElement('div'); opts.className='opts';
  const fb=document.createElement('div'); fb.className='fb';
  const r=document.createElement('div'); r.className='row'; r.style.display='none';
  st.opts.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+t+'</span>';
    b.onclick=()=>{
      if(i===st.ok){ b.classList.add('ok'); opts.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        feedback(fb,true,st.explain); award(); r.style.display='flex';
        r.appendChild(nextBtn(c, lastOfStage()?'Завершить этап →':'Далее →')); fit();
      }else{ b.classList.add('bad'); markTriedWrong();
        feedback(fb,false,st.explain); setTimeout(()=>b.classList.remove('bad'),500); }
    };
    opts.appendChild(b);
  });
  c.appendChild(opts); c.appendChild(fb); c.appendChild(r);
  return c;
}

function renderMulti(st){
  const c=cardEl(st.q, st.tag||'Задание');
  const hint=document.createElement('p'); hint.className='hint'; hint.textContent='Выберите все подходящие варианты и нажмите «Проверить»';
  const chips=document.createElement('div'); chips.className='chips';
  const sel=new Set();
  st.items.forEach(([t,ok],i)=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=t;
    b.onclick=()=>{ if(sel.has(i)){ sel.delete(i); b.classList.remove('sel'); } else { sel.add(i); b.classList.add('sel'); } };
    chips.appendChild(b);
  });
  const fb=document.createElement('div'); fb.className='fb';
  const r=document.createElement('div'); r.className='row';
  const chk=document.createElement('button'); chk.className='btn'; chk.textContent='Проверить';
  chk.onclick=()=>{
    const need=st.items.map((x,i)=>x[1]?i:-1).filter(i=>i>=0);
    const okSet = need.length===sel.size && need.every(i=>sel.has(i));
    if(okSet){ [...chips.children].forEach((b,i)=>{ b.className='chip '+(st.items[i][1]?'ok':''); b.onclick=null; });
      feedback(fb,true,st.explain); award(); chk.disabled=true;
      r.appendChild(nextBtn(c, lastOfStage()?'Завершить этап →':'Далее →')); fit();
    }else{ markTriedWrong();
      [...chips.children].forEach((b,i)=>{ const isSel=sel.has(i), isOk=!!st.items[i][1];
        if(isSel&&!isOk){ b.className='chip bad'; setTimeout(()=>{ b.className='chip'; sel.delete(i); },600); } });
      feedback(fb,false,'Есть ошибки. '+st.explain); }
  };
  r.appendChild(chk);
  c.appendChild(hint); c.appendChild(chips); c.appendChild(fb); c.appendChild(r);
  return c;
}

function renderMatch(st){
  const c=cardEl(st.q, st.tag||'Задание');
  const fb=document.createElement('div'); fb.className='fb';
  const grid=document.createElement('div'); grid.className='matchwrap';
  const L=document.createElement('div'); L.className='mcol'; L.innerHTML='<h3>Вид СИЗ (в ТЗ)</h3>';
  const R=document.createElement('div'); R.className='mcol'; R.innerHTML='<h3>Показатель (Решение № 40)</h3>';
  let selL=null, done=0, errs=0;
  const rights=shuffle(st.pairs.map((p,i)=>({t:p[1],i})));
  st.pairs.forEach((p,i)=>{
    const b=document.createElement('button'); b.className='mitem'; b.textContent=p[0]; b.dataset.i=i;
    b.onclick=()=>{ if(b.classList.contains('done'))return;
      L.querySelectorAll('.mitem').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); selL=i; };
    L.appendChild(b);
  });
  rights.forEach(o=>{
    const b=document.createElement('button'); b.className='mitem'; b.textContent=o.t; b.dataset.i=o.i;
    b.onclick=()=>{ if(b.classList.contains('done'))return;
      if(selL===null){ toastMsg('Сначала выберите вид СИЗ слева'); return; }
      if(selL===o.i){ b.classList.add('done'); L.querySelector('[data-i="'+selL+'"]').classList.add('done');
        L.querySelector('[data-i="'+selL+'"]').classList.remove('sel'); selL=null; done++;
        if(done===st.pairs.length){ if(errs===0) award(); else markTriedWrong();
          feedback(fb,true,st.explain);
          const r=document.createElement('div'); r.className='row';
          r.appendChild(nextBtn(c, lastOfStage()?'Завершить этап →':'Далее →')); c.appendChild(r); fit(); }
      }else{ errs++; markTriedWrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),500);
        feedback(fb,false,'Не та пара — попробуйте ещё.'); }
    };
    R.appendChild(b);
  });
  grid.appendChild(L); grid.appendChild(R);
  c.appendChild(grid); c.appendChild(fb);
  return c;
}

function renderToggle(st){
  const c=cardEl(st.q, st.tag||'Задание');
  const fb=document.createElement('div'); fb.className='fb';
  const rows=[]; const chosen=st.rows.map(()=>null);
  const box=document.createElement('div'); box.style.cssText='display:flex;flex-direction:column;gap:.38em';
  st.rows.forEach((rw,i)=>{
    const d=document.createElement('div'); d.className='trow';
    d.innerHTML='<span class="lb">'+(i+1)+'. '+rw[0]+'</span>';
    const bb=document.createElement('div'); bb.className='tbtns';
    st.variants.forEach((v,j)=>{
      const b=document.createElement('button'); b.className='tb'; b.textContent=v;
      b.onclick=()=>{ chosen[i]=j; bb.querySelectorAll('.tb').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); d.classList.remove('bad'); };
      bb.appendChild(b);
    });
    d.appendChild(bb); box.appendChild(d); rows.push(d);
  });
  const r=document.createElement('div'); r.className='row';
  const chk=document.createElement('button'); chk.className='btn'; chk.textContent='Проверить';
  chk.onclick=()=>{
    if(chosen.some(x=>x===null)){ toastMsg('Ответьте на все позиции'); return; }
    const allOk=chosen.every((x,i)=>x===st.rows[i][1]);
    if(allOk){ rows.forEach(d=>d.classList.add('ok')); feedback(fb,true,st.explain); award(); chk.disabled=true;
      r.appendChild(nextBtn(c, lastOfStage()?'Завершить этап →':'Далее →')); fit();
    }else{ markTriedWrong(); rows.forEach((d,i)=>{ d.classList.add(chosen[i]===st.rows[i][1]?'ok':'bad');
        setTimeout(()=>d.classList.remove('bad'),700); });
      feedback(fb,false,'Не все позиции верно. '+st.explain); }
  };
  r.appendChild(chk);
  c.appendChild(box); c.appendChild(fb); c.appendChild(r);
  return c;
}

function renderCases(st){
  const c=cardEl(st.q, st.tag||'Кейс');
  const hint=document.createElement('p'); hint.className='hint'; hint.textContent='Отметьте позиции, которые нельзя принять, и нажмите «Проверить»';
  const grid=document.createElement('div'); grid.className='cases';
  const sel=new Set();
  st.items.forEach(([tt,t,ok],i)=>{
    const b=document.createElement('button'); b.className='case';
    b.innerHTML='<b>'+tt+'</b>'+t;
    b.onclick=()=>{ if(sel.has(i)){ sel.delete(i); b.classList.remove('sel'); } else { sel.add(i); b.classList.add('sel'); } };
    grid.appendChild(b);
  });
  const fb=document.createElement('div'); fb.className='fb';
  const r=document.createElement('div'); r.className='row';
  const chk=document.createElement('button'); chk.className='btn'; chk.textContent='Проверить';
  chk.onclick=()=>{
    const need=st.items.map((x,i)=>x[2]?i:-1).filter(i=>i>=0);
    const okSet=need.length===sel.size && need.every(i=>sel.has(i));
    if(okSet){ [...grid.children].forEach((b,i)=>{ b.className='case '+(st.items[i][2]?'ok':''); b.onclick=null; });
      feedback(fb,true,st.explain); award(); chk.disabled=true;
      r.appendChild(nextBtn(c, lastOfStage()?'Завершить этап →':'Далее →')); fit();
    }else{ markTriedWrong();
      [...grid.children].forEach((b,i)=>{ if(sel.has(i)&&!st.items[i][2]){ b.classList.add('bad');
        setTimeout(()=>b.classList.remove('bad'),600); } });
      feedback(fb,false,'Отклонены не все проблемные позиции (или отклонено лишнее). '+st.explain); }
  };
  r.appendChild(chk);
  c.appendChild(hint); c.appendChild(grid); c.appendChild(fb); c.appendChild(r);
  return c;
}

function renderComplete(){
  const c=cardEl(null);
  const isLast=state.stage+1>=STAGES.length;
  const verdictTxt=isLast
    ? 'Итог обучения подведён: от новых видов СИЗ до росписи в личной карточке!'
    : 'Открыт этап '+(state.stage+2)+' — «'+STAGES[state.stage+1].name+'»';
  c.innerHTML='<div class="final">'+
    '<div class="medal">🎉</div>'+
    '<div class="big">Этап '+(state.stage+1)+' пройден!</div>'+
    '<div class="verdict" style="color:#a7f3c9">'+verdictTxt+'</div>'+
    '<div class="sub">Текущий результат: '+state.score+' из '+TOTAL_TASKS+' баллов. Баллы начисляются только за ответы с первой попытки.</div></div>';
  const r=document.createElement('div'); r.className='row'; r.style.justifyContent='center';
  const b=document.createElement('button'); b.className='btn';
  b.textContent= state.stage+1<STAGES.length ? 'Перейти к этапу '+(state.stage+2)+' →' : 'Показать результаты →';
  b.onclick=()=>{ if(state.stage+1<STAGES.length){ goNextStage(); }
                  else { state.step=STAGES[state.stage].steps.length+1; save(); render(); } };
  r.appendChild(b); c.appendChild(r);
  return c;
}

function renderFinal(){
  const pct=Math.round(state.score/TOTAL_TASKS*100);
  let verdict='Требуется повторить материал уроков', medal='📚';
  if(pct>=90){ verdict='Отлично! Итог обучения усвоен: новые виды СИЗ, показатели Решения № 40, ГОСТы и границы СОТ'; medal='🏆'; }
  else if(pct>=70){ verdict='Хороший результат. Повторите этапы, где были ошибки'; medal='🥈'; }
  else if(pct>=50){ verdict='Удовлетворительно. Рекомендуем пройти этапы заново'; medal='🎯'; }
  const c=cardEl(null);
  c.innerHTML='<div class="final">'+
    '<div class="medal">'+medal+'</div>'+
    '<div class="big">'+state.score+' / '+TOTAL_TASKS+'</div>'+
    '<div class="verdict" style="color:#7dd3fc">'+verdict+'</div>'+
    '<div class="sub">Итог обучения: новые виды СИЗ в регламенте → показатели Решения № 40 для техзадания → ГОСТы и формы оценки соответствия → входной контроль → выдача с росписью в личной карточке → аргументы в защиту своих границ. Ключевая дата: 27.04.2027 — обязательное применение новых требований.</div></div>';
  const r=document.createElement('div'); r.className='row'; r.style.justifyContent='center';
  const b=document.createElement('button'); b.className='btn'; b.textContent='⟲ Пройти заново';
  b.onclick=resetAll; r.appendChild(b); c.appendChild(r);
  wrap.appendChild(c);
  updateProgress(); posLabel.textContent='Тренажёр завершён'; fit();
  if(typeof confetti==='function'){ try{ confetti({particleCount:120, spread:75, origin:{y:.6}}); }catch(e){} }
}

function lastOfStage(){ return state.step===STAGES[state.stage].steps.length-1; }

/* ---------------- ГЛАВНЫЙ РЕНДЕР ---------------- */
function render(){
  renderNav();
  const st=STAGES[state.stage];
  wrap.innerHTML='';
  const isLast=state.stage===STAGES.length-1;
  if(isLast && state.step>st.steps.length){ renderFinal(); return; }
  if(state.step>=st.steps.length){ wrap.appendChild(renderComplete()); updateProgress(); fit(); return; }
  const s=st.steps[state.step];
  let c;
  if(s.type==='brief')   c=renderBrief(s);
  else if(s.type==='single') c=renderSingle(s);
  else if(s.type==='multi')  c=renderMulti(s);
  else if(s.type==='match')  c=renderMatch(s);
  else if(s.type==='toggle') c=renderToggle(st0(s));
  else if(s.type==='cases')  c=renderCases(s);
  wrap.appendChild(c);
  updateProgress(); fit();
}
function st0(s){ return s; }

/* «Далее» на последнем шаге этапа завершает этап */
const _nextBtn = nextBtn;
nextBtn = function(card, label){
  if(lastOfStage()){
    const b=document.createElement('button'); b.className='btn'; b.textContent=label||'Завершить этап →';
    b.onclick=finishStage; return b;
  }
  return _nextBtn(card,label);
};

/* ---------------- АВТОМАССШТАБ (без скроллов и потери контента) ---------------- */
function fit(){
  const card=wrap.querySelector('.card'); if(!card) return;
  card.style.transform=''; card.style.transformOrigin='center center';
  const availW=wrap.clientWidth-12, availH=wrap.clientHeight-8;
  /* измеряем ПОЛНУЮ высоту/ширину содержимого карточки (scroll* учитывает переполнение) */
  const fullW=Math.max(card.offsetWidth, card.scrollWidth);
  const fullH=Math.max(card.offsetHeight, card.scrollHeight);
  const s=Math.min(1, availW/fullW, availH/fullH);
  if(s<0.995){ card.style.transform='scale('+s.toFixed(4)+')'; }
}
let raf=null;
window.addEventListener('resize',()=>{ if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ fit(); clampH(); }); });

/* ---------------- РЕСАЙЗЕР (450–600 px) ---------------- */
const MIN_H=450, MAX_H=600;
function defaultH(){ return Math.max(MIN_H, Math.min(MAX_H, window.innerHeight-40)); }
function setH(h){
  h=Math.max(MIN_H, Math.min(MAX_H, Math.round(h)));
  trainer.style.height=h+'px'; hLabel.textContent='↕ '+h+' px'; fit();
}
function clampH(){ setH(parseInt(trainer.style.height)||defaultH()); }
const resizer=$('resizer');
let drag=null;
resizer.addEventListener('pointerdown',e=>{
  drag={y:e.clientY, h:trainer.getBoundingClientRect().height};
  resizer.setPointerCapture(e.pointerId); document.body.style.userSelect='none';
});
resizer.addEventListener('pointermove',e=>{ if(!drag)return; setH(drag.h+(e.clientY-drag.y)); });
resizer.addEventListener('pointerup',e=>{ drag=null; document.body.style.userSelect=''; });
resizer.addEventListener('dblclick',()=>setH(defaultH()));

/* ---------------- СБРОС ---------------- */
function resetAll(){
  state={ stage:0, step:0, unlocked:0, score:0, firstTried:{}, stageDone:[] };
  save(); render(); toastMsg('Тренажёр перезапущен');
}
$('resetBtn').onclick=()=>{ if(confirm('Начать тренажёр заново? Прогресс будет сброшен.')) resetAll(); };

/* ---------------- СТАРТ ---------------- */
setH(defaultH());
render();
})();
</script>
